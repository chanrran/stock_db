name: Daily Stock Data Update

# 평일 매일 KST 21:00 (UTC 12:00) 자동 실행 + 수동 트리거 가능
# 21:00 선택 이유: NXT 야간장이 KST 20:00까지 운영 → 마감 후 안전 마진
on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-db-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update
        run: python scripts/daily_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 폴더가 존재하는 경우에만 add (빈 폴더 안전 처리)
          for d in data archive logs; do
            if [ -d "$d" ]; then
              git add "$d"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit (likely holiday or already up to date)"
          else
            git commit -m "Daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
