name: Daily Stock Data Update

# 평일 매일 KST 16:00 (UTC 07:00) 자동 실행 + 수동 트리거 가능
# 16:00 선택 이유: KRX 정규장 마감(15:30) 직후 → Project 20 저녁 19:00 실행 전에 데이터 준비
on:
  workflow_dispatch:
    inputs:
      force_backfill:
        description: '모든 종목 강제 재백필 (기존 CSV를 archive로 옮기고 10년치 새로 받음)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: stock-db-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update or force backfill
        env:
          # KRX 인증 (GitHub Secrets에서 주입)
          # pykrx v1.2.8부터 KRX 사이트가 일부 endpoint에 로그인 요구
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          if [ "${{ github.event.inputs.force_backfill }}" = "true" ]; then
            echo ">>> FORCE BACKFILL mode <<<"
            python scripts/initial_backfill.py
          else
            python scripts/daily_update.py
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 폴더가 존재하는 경우에만 add (빈 폴더 안전 처리)
          for d in data archive logs; do
            if [ -d "$d" ]; then
              git add "$d"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit (likely holiday or already up to date)"
          else
            git commit -m "Daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
